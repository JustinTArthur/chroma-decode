name: 'Set up encode-orc fixture generator'
description: >-
  Clone, build (with cache), and export CHD_ENCODE_ORC so a job can synthesize
  colour-bars TBC fixtures. Linux only: the build workflow generates the
  fixtures once and hands them to the other platforms as an artifact, so this
  never has to run anywhere else.
inputs:
  commit:
    description: 'encode-orc commit SHA to pin (matches the locally-validated build).'
    required: false
    default: 'a7004c4'
runs:
  using: 'composite'
  steps:
    - name: Cache encode-orc clone + build
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/encode-orc
        key: encode-orc-${{ runner.os }}-${{ runner.arch }}-${{ inputs.commit }}

    # Runtime deps must be installed every time, not just on cache miss,
    # because encode-orc dynamically links yaml-cpp / spdlog / libpng /
    # sqlite3 — the cached binary needs them resolvable at exec time.
    - name: encode-orc deps
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake ninja-build pkg-config \
          libsqlite3-dev libyaml-cpp-dev libspdlog-dev libpng-dev \
          libavcodec-dev libavformat-dev libavutil-dev libswscale-dev

    - name: Clone + build encode-orc
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone https://github.com/simoninns/encode-orc.git ~/encode-orc
        cd ~/encode-orc
        git checkout ${{ inputs.commit }}
        # encode-orc builds with -Werror, so a distro bump in one of its
        # dependencies (spdlog against a newer fmt, say) turns a deprecation
        # warning into a failed fixture build. We only need the binary, so
        # silence the warnings outright: CMAKE_CXX_FLAGS lands ahead of the
        # target's own flags, where a -Wno-error would just be undone by the
        # -Werror that follows it, and -w would not.
        cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_FLAGS=-w
        cmake --build build

    - name: Export CHD_ENCODE_ORC
      shell: bash
      run: echo "CHD_ENCODE_ORC=${HOME}/encode-orc/build/encode-orc" >> $GITHUB_ENV
