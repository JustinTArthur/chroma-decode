name: 'Set up encode-orc fixture generator'
description: >-
  Clone, build (with cache), and export CHD_ENCODE_ORC so the
  test_integration test runs against real synthesized NTSC + PAL
  colour-bars TBC fixtures instead of self-skipping.
inputs:
  commit:
    description: 'encode-orc commit SHA to pin (matches the locally-validated build).'
    required: false
    default: 'a7004c4'
runs:
  using: 'composite'
  steps:
    - name: Cache encode-orc clone + build
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/encode-orc
        key: encode-orc-${{ runner.os }}-${{ runner.arch }}-${{ inputs.commit }}

    # Runtime deps must be installed every time, not just on cache miss,
    # because encode-orc dynamically links yaml-cpp / spdlog / libpng /
    # sqlite3 — the cached binary needs them resolvable at exec time.
    - name: encode-orc deps (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake ninja-build pkg-config \
          libsqlite3-dev libyaml-cpp-dev libspdlog-dev libpng-dev \
          libavcodec-dev libavformat-dev libavutil-dev libswscale-dev

    - name: encode-orc deps (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install cmake ninja pkg-config yaml-cpp spdlog libpng ffmpeg

    # pkg-config-lite provides the pkg-config tool that encode-orc's
    # CMakeLists uses to resolve the FFMPEG dependency. vcpkg is
    # preinstalled on the hosted Windows images.
    - name: encode-orc deps (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install -y --no-progress pkgconfiglite
        vcpkg install sqlite3:x64-windows yaml-cpp:x64-windows spdlog:x64-windows libpng:x64-windows
        vcpkg install "ffmpeg[avcodec,avformat,avutil,swscale]:x64-windows"
        $vcpkgInstalled = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
        "PKG_CONFIG_PATH=$vcpkgInstalled\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
        "CMAKE_PREFIX_PATH=$vcpkgInstalled" | Out-File -FilePath $env:GITHUB_ENV -Append
        "$vcpkgInstalled\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Clone + build encode-orc (Linux/macOS)
      if: runner.os != 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone https://github.com/simoninns/encode-orc.git ~/encode-orc
        cd ~/encode-orc
        git checkout ${{ inputs.commit }}
        cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build

    - name: Clone + build encode-orc (Windows)
      if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        git clone https://github.com/simoninns/encode-orc.git "$env:USERPROFILE\encode-orc"
        Set-Location "$env:USERPROFILE\encode-orc"
        git checkout ${{ inputs.commit }}
        cmake -B build -S . -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows
        cmake --build build

    - name: Export CHD_ENCODE_ORC (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: echo "CHD_ENCODE_ORC=${HOME}/encode-orc/build/encode-orc" >> $GITHUB_ENV

    - name: Export CHD_ENCODE_ORC (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "CHD_ENCODE_ORC=$env:USERPROFILE\encode-orc\build\encode-orc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
