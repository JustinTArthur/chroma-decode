name: build

on:
  push:
    branches: [ main, extract-base ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            ort_arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            ort_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsqlite3-dev libfftw3-dev

      - name: Python venv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install meson

      - name: Download ONNX Runtime (Microsoft release, Linux ${{ matrix.arch }} CPU)
        run: |
          ORT_VER=1.26.0
          curl -L -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-linux-${{ matrix.ort_arch }}-${ORT_VER}.tgz"
          mkdir -p ${HOME}/ort
          tar -xzf ort.tgz -C ${HOME}/ort --strip-components=1
          echo "ORT_ROOT=${HOME}/ort" >> $GITHUB_ENV

      - name: Configure
        run: |
          . .venv/bin/activate
          meson setup build -Donnxruntime_root="${ORT_ROOT}"

      - name: Build
        run: |
          . .venv/bin/activate
          meson compile -C build

      - name: Set up encode-orc (drives integration fixtures)
        uses: ./.github/actions/setup-encode-orc

      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.ORT_ROOT }}/lib
        run: |
          . .venv/bin/activate
          meson test -C build --print-errorlogs

      - name: Verify exported chd_* symbols
        run: |
          # Lib name is libchromadec.so.0.x.y; resolve the actual file.
          LIB=$(ls build/src/libchromadec.so.0.* 2>/dev/null | head -1)
          test -n "$LIB" || (echo "no built shared lib found" >&2; exit 1)
          echo "Inspecting $LIB"
          nm -D --defined-only "$LIB" | awk '$2 == "T" && $3 ~ /^chd_/ { print $3 }' > /tmp/exports.txt
          wc -l /tmp/exports.txt
          test "$(wc -l < /tmp/exports.txt)" -ge 40
          # No non-chd_ globals should leak.
          nm -D --defined-only "$LIB" | awk '$2 == "T" && $3 !~ /^chd_/ { print $3 }' > /tmp/leaks.txt
          if [ -s /tmp/leaks.txt ]; then
            echo "Non-chd_ symbols leaked:"; cat /tmp/leaks.txt; exit 1
          fi

      - name: Install (DESTDIR sandbox)
        run: |
          . .venv/bin/activate
          DESTDIR=/tmp/inst meson install -C build --quiet
          find /tmp/inst -type f | head -30

      - name: CMake consumer smoke test (find_package + pkg-config)
        env:
          LD_LIBRARY_PATH: ${{ env.ORT_ROOT }}/lib
        run: |
          . .venv/bin/activate
          # Install to a real prefix (not a DESTDIR sandbox): the generated
          # chromadec.pc / chromadecConfig.cmake bake in the configured prefix,
          # so a relocatable consumer test needs the prefix to be the real one.
          meson configure build -Dprefix=/tmp/inst-cmake
          meson install -C build --quiet
          cfg=$(find /tmp/inst-cmake -name chromadecConfig.cmake | head -1)
          pc=$(find /tmp/inst-cmake -name chromadec.pc | head -1)
          lib=$(find /tmp/inst-cmake -name 'libchromadec.so.0.*' | head -1)
          test -n "$cfg" || { echo "chromadecConfig.cmake not installed" >&2; exit 1; }
          test -n "$pc"  || { echo "chromadec.pc not installed" >&2; exit 1; }
          # The CMake config has no exported targets file; it falls back to
          # pkg-config, so PKG_CONFIG_PATH must point at the installed .pc.
          export PKG_CONFIG_PATH="$(dirname "$pc")"
          export LD_LIBRARY_PATH="$(dirname "$lib"):${LD_LIBRARY_PATH}"
          cmake -S tests/cmake-consumer -B /tmp/cc-build -Dchromadec_DIR="$(dirname "$cfg")"
          cmake --build /tmp/cc-build
          /tmp/cc-build/consumer

  # x86_64 only — one sanitizer run is enough to gate the suite.
  linux-asan-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsqlite3-dev libfftw3-dev

      - name: Python venv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install meson

      - name: Download ONNX Runtime (Microsoft release, Linux x64 CPU)
        run: |
          ORT_VER=1.26.0
          curl -L -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-linux-x64-${ORT_VER}.tgz"
          mkdir -p ${HOME}/ort
          tar -xzf ort.tgz -C ${HOME}/ort --strip-components=1
          echo "ORT_ROOT=${HOME}/ort" >> $GITHUB_ENV

      - name: Configure (ASan + UBSan)
        run: |
          . .venv/bin/activate
          meson setup build \
            -Donnxruntime_root="${ORT_ROOT}" \
            -Db_sanitize=address,undefined \
            -Db_lundef=false

      - name: Build
        run: |
          . .venv/bin/activate
          meson compile -C build

      - name: Set up encode-orc (drives integration fixtures)
        uses: ./.github/actions/setup-encode-orc

      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.ORT_ROOT }}/lib
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=0
        run: |
          . .venv/bin/activate
          meson test -C build --print-errorlogs

  # TSan is its own job because address+thread can't be combined in one
  # binary. x86_64 only (the suite is identical to the ASan run; we just
  # want to catch races in the chd_decode_frames_async path).
  linux-tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsqlite3-dev libfftw3-dev

      - name: Python venv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install meson

      - name: Download ONNX Runtime (Microsoft release, Linux x64 CPU)
        run: |
          ORT_VER=1.26.0
          curl -L -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-linux-x64-${ORT_VER}.tgz"
          mkdir -p ${HOME}/ort
          tar -xzf ort.tgz -C ${HOME}/ort --strip-components=1
          echo "ORT_ROOT=${HOME}/ort" >> $GITHUB_ENV

      - name: Configure (TSan)
        run: |
          . .venv/bin/activate
          meson setup build \
            -Donnxruntime_root="${ORT_ROOT}" \
            -Db_sanitize=thread \
            -Db_lundef=false

      - name: Build
        run: |
          . .venv/bin/activate
          meson compile -C build

      - name: Set up encode-orc (drives integration fixtures)
        uses: ./.github/actions/setup-encode-orc

      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.ORT_ROOT }}/lib
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          . .venv/bin/activate
          meson test -C build --print-errorlogs

  macos:
    name: macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            ort_arch: arm64
            # 1.26.0 is current; macOS arm64 has shipped every release.
            ort_ver: '1.26.0'
          - arch: x86_64
            runner: macos-13
            ort_arch: x86_64
            # Microsoft dropped onnxruntime-osx-x86_64 after 1.23.2;
            # 1.24.0+ ships arm64 only. Pin to the last release that
            # included an Intel-Mac asset.
            ort_ver: '1.23.2'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: brew install ninja pkg-config sqlite fftw

      - name: Python venv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install meson

      - name: Download ONNX Runtime (Microsoft release, macOS ${{ matrix.arch }} with CoreML)
        run: |
          ORT_VER=${{ matrix.ort_ver }}
          curl -L -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-osx-${{ matrix.ort_arch }}-${ORT_VER}.tgz"
          mkdir -p ${HOME}/ort
          tar -xzf ort.tgz -C ${HOME}/ort --strip-components=1
          echo "ORT_ROOT=${HOME}/ort" >> $GITHUB_ENV

      - name: Configure
        run: |
          . .venv/bin/activate
          meson setup build -Donnxruntime_root="${ORT_ROOT}"

      - name: Build
        run: |
          . .venv/bin/activate
          meson compile -C build

      - name: Set up encode-orc (drives integration fixtures)
        uses: ./.github/actions/setup-encode-orc

      - name: Test
        env:
          DYLD_LIBRARY_PATH: ${{ env.ORT_ROOT }}/lib
        run: |
          . .venv/bin/activate
          meson test -C build --print-errorlogs

      - name: Verify exported chd_* symbols
        run: |
          LIB="build/src/libchromadec.0.dylib"
          test -f "$LIB" || (echo "no built dylib at $LIB" >&2; exit 1)
          nm -g "$LIB" | awk '$2 == "T" && $3 ~ /^_chd_/ { print substr($3,2) }' > /tmp/exports.txt
          wc -l /tmp/exports.txt
          test "$(wc -l < /tmp/exports.txt)" -ge 40
          # No non-chd_ globals should be exported.
          nm -g "$LIB" | awk '$2 == "T" && $3 !~ /^_chd_/ { print $3 }' > /tmp/leaks.txt
          if [ -s /tmp/leaks.txt ]; then
            echo "Non-chd_ symbols leaked:"; cat /tmp/leaks.txt; exit 1
          fi

  # Windows MSVC. Skeleton — expected to need first-run iteration once
  # the repo lands on GitHub (vcpkg/meson/pkg-config/MSVC environment
  # interactions can't be fully validated locally on macOS/Linux).
  # encode-orc is not wired in here yet: the composite action's Windows
  # branch + a Windows-runnable encode-orc build are a separate
  # follow-up. Without encode-orc the integration test
  # self-skips with PASS, so the rest of the suite still gates.
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: vcpkg deps (sqlite3 + fftw3)
        shell: pwsh
        run: |
          vcpkg install sqlite3:x64-windows fftw3:x64-windows
          $vcpkgInstalled = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "PKG_CONFIG_PATH=$vcpkgInstalled\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$vcpkgInstalled" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$vcpkgInstalled\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Python tools (meson + ninja)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja

      - name: Download ONNX Runtime (Microsoft release, Windows x64 CPU)
        shell: pwsh
        run: |
          $ORT_VER = "1.26.0"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VER/onnxruntime-win-x64-$ORT_VER.zip" -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath "$env:USERPROFILE\ort_extract"
          $ortDir = (Get-ChildItem "$env:USERPROFILE\ort_extract" | Where-Object PSIsContainer | Select-Object -First 1).FullName
          "ORT_ROOT=$ortDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$ortDir\lib" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure
        shell: pwsh
        run: meson setup build "-Donnxruntime_root=$env:ORT_ROOT"

      - name: Build
        shell: pwsh
        run: meson compile -C build

      - name: Set up encode-orc (drives integration fixtures)
        uses: ./.github/actions/setup-encode-orc

      - name: Test
        shell: pwsh
        run: meson test -C build --print-errorlogs

      - name: Verify exported chd_* symbols
        shell: pwsh
        run: |
          $dll = (Get-ChildItem build\src\chromadec*.dll | Select-Object -First 1).FullName
          if (-not $dll) { Write-Error "no built chromadec DLL found"; exit 1 }
          Write-Host "Inspecting $dll"
          $out = & dumpbin /exports $dll
          # dumpbin export rows look like: "    1    0 00001000 chd_video_open_composite"
          $chd  = ($out | Select-String '\bchd_\w+').Count
          $leak = ($out | Select-String '^\s+\d+\s+\d+\s+[0-9A-Fa-f]+\s+(?!chd_)[A-Za-z_]\w*$').Count
          Write-Host "chd_ exports: $chd  (non-chd globals: $leak)"
          if ($chd -lt 40) { Write-Error "expected >=40 chd_ exports"; exit 1 }
          if ($leak -gt 0) { Write-Error "non-chd symbols leaked"; exit 1 }